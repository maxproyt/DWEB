<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Médias do Aluno</title>
</head>
<body>
    <h2>Dados do Aluno</h2>

    <form id="formAluno">
        <label>Nome:</label>
        <input type="text" id="nome" required><br><br>

        <label>Média 1:</label>
        <input type="number" id="m1" step="0.01" required><br><br>

        <label>Média 2:</label>
        <input type="number" id="m2" step="0.01" required><br><br>

        <label>Média 3:</label>
        <input type="number" id="m3" step="0.01" required><br><br>

        <label>Média 4:</label>
        <input type="number" id="m4" step="0.01" required><br><br>

        <button type="button" onclick="calcularMedia()">Calcular Média</button>
    </form>

    <h3 id="resultadoAluno"></h3>

    <script src="media.js"></script>
</body>
</html>
